name: Publish to PyPI

# 手动触发或推送 v* 标签。使用 PyPI Trusted Publishing：
# 首次发布前需在 PyPI 项目设置里配置 GitHub OIDC（publisher = kkkkikun/QuizForge, workflow = 此文件）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install --upgrade uv
          uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
