name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install --upgrade uv

      - name: Check lock file is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Check browser bundle is in sync with quizforge/
        run: uv run --frozen python scripts/build_browser_bundle.py --check

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (tsc strict + eslint)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # E2E 的 webServer 跑 `npm run preview`（vite preview），需要上一步产出的 dist/，
      # 所以 Build 必须排在 E2E 之前；否则 preview 返回 404，webServer 等到超时。
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        working-directory: frontend
        run: npx playwright test
