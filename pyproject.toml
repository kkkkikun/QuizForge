[project]
name = "quizforge"
version = "0.1.0"
description = "期末选填题速刷：Word/PDF → 单文件静态答题网页"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "openai>=1.50",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
quizforge = "quizforge.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "fpdf2>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quizforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
